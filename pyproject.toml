[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "page"
version = "0.2.0"
description = "Minimal, reliable Python coding agent harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
page = "core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["core*"]
exclude = ["page*", "tests*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/minimal_core_test.py",
  "tests/minimal_tools_test.py",
  "tests/minimal_context_test.py",
  "tests/minimal_repair_test.py",
  "tests/minimal_provider_test.py",
  "tests/unit/test_minimal_support.py",
]
addopts = "-p no:cacheprovider"
markers = [
  "slow: deterministic benchmark or ablation suites not required for the interview smoke test",
]
