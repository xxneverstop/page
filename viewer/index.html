<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Page Trace · 运行观测</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">P<span></span></span>
      <div><strong>Page<span class="brand-trace">Trace</span></strong><span class="brand-caption">运行观测</span></div>
    </div>
    <div class="header-actions">
      <span class="connection" id="connection" role="status">正在连接</span>
      <button class="button button-primary" type="button" id="follow" aria-pressed="true">实时跟随</button>
      <button class="button" type="button" id="refresh">刷新</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-labelledby="runs-heading">
      <div class="sidebar-head">
        <div class="section-title"><h2 id="runs-heading">运行记录</h2><span id="runCount" class="count-badge">0</span></div>
        <label class="sr-only" for="runSearch">搜索运行</label>
        <input type="search" id="runSearch" spellcheck="false" placeholder="搜提问、模型或 Run ID">
        <label class="sr-only" for="runStatus">按运行状态筛选</label>
        <select id="runStatus">
          <option value="">全部状态</option>
          <option value="completed">已完成</option>
          <option value="unfinished">未结束</option>
          <option value="failed">失败</option>
          <option value="stopped">已停止</option>
        </select>
      </div>
      <div id="runList" class="run-list" aria-label="运行列表">
        <p class="empty-state">正在读取运行记录…</p>
      </div>
      <div class="sidebar-footer"><span class="folder-mark" aria-hidden="true"></span> 本地日志 · 只读</div>
    </aside>

    <main class="dashboard" aria-label="运行追踪详情">
      <section class="overview" aria-labelledby="runTitle">
        <div class="run-heading">
          <div>
            <div class="run-kicker"><span>运行概览</span><span id="runId" class="run-id"></span></div>
            <h1 id="runTitle">选择一条运行</h1>
            <p id="runMeta" class="run-meta">在 Page 发起请求后，这里会显示它的执行过程。</p>
          </div>
          <span class="status-pill is-neutral" id="runBadge">等待日志</span>
        </div>

        <div class="metrics" aria-label="运行统计">
          <div class="metric metric-model"><span>模型调用轮次</span><strong id="statCalls">—</strong><small id="statHttpDetail">已记录的调用轮次</small></div>
          <div class="metric metric-tool"><span>工具调用</span><strong id="statTools">—</strong><small>含拒绝与失败</small></div>
          <div class="metric metric-token"><span>Token 用量</span><strong id="statTokens">—</strong><small id="statTokenDetail">以服务端返回为准</small></div>
          <div class="metric metric-time"><span>运行耗时</span><strong id="statDuration">—</strong><small>结束时记录总耗时</small></div>
        </div>

        <div class="path-panel">
          <div class="section-title path-title"><h2>阶段概览</h2><span id="captureBadge" class="capture-badge">等待日志</span></div>
          <ol id="stages" class="stages" aria-label="已记录的执行阶段"></ol>
        </div>
      </section>

      <div class="explorer">
        <section class="timeline panel" aria-labelledby="timeline-heading">
          <header class="panel-heading">
            <div class="section-title"><h2 id="timeline-heading">执行时间线</h2><span id="eventCount" class="count-badge">0</span></div>
            <div id="eventFilters" class="filter-group" aria-label="筛选时间线事件">
              <button type="button" data-filter="focus" aria-pressed="true">关键事件</button>
              <button type="button" data-filter="all" aria-pressed="false">全部</button>
              <button type="button" data-filter="context" aria-pressed="false">上下文</button>
              <button type="button" data-filter="model" aria-pressed="false">模型</button>
              <button type="button" data-filter="tool" aria-pressed="false">工具</button>
              <button type="button" data-filter="recovery" aria-pressed="false">恢复</button>
            </div>
          </header>
          <div id="eventList" class="event-list" aria-label="按时间顺序排列的事件">
            <p class="empty-state">选中一条运行后查看事件。</p>
          </div>
        </section>

        <section class="inspector panel" aria-labelledby="detailTitle">
          <header class="panel-heading">
            <div id="detailTabs" class="filter-group detail-tabs" aria-label="详情视图">
              <button type="button" data-inspector="event" aria-pressed="true">事件详情</button>
              <button type="button" data-inspector="report" aria-pressed="false">运行报告</button>
            </div>
            <div class="section-title detail-heading"><h2 id="detailTitle">等待选择事件</h2><span id="detailTag" class="detail-tag"></span></div>
          </header>
          <div id="detailBody" class="detail-body">
            <p class="empty-state">选择时间线上的事件，查看它收到什么、作出什么判断，以及产生了什么结果。</p>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
